[package]
name = "watchdog-probe"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
testcontainers = { path = "../testcontainers", default-features = false, features = ["watchdog"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
